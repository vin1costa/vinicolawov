<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                    script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com;
                    style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
                    font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com;
                    img-src 'self' data: https:;
                    connect-src 'self' https://vinicolawov.viniciusxp13.workers.dev;
                    frame-ancestors 'none';
                    base-uri 'self';
                    form-action 'self';">
    <title>Membros — Clã Vinícola</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cellar': '#160503',
                        'wine-dark': '#3D0F0A',
                        'wine': '#6B1B14',
                        'wine-light': '#9A3327',
                        'gold': '#C9A227',
                        'gold-bright': '#E4C766',
                        'cream': '#F1E6D2'
                    },
                    fontFamily: {
                        'display': ['Cinzel', 'serif'],
                        'body': ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

        :root {
            --cellar: #160503;
            --wine-dark: #3D0F0A;
            --wine: #6B1B14;
            --wine-light: #9A3327;
            --gold: #C9A227;
            --gold-bright: #E4C766;
            --cream: #F1E6D2;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--cellar);
            color: var(--cream);
            font-weight: 300;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(154,51,39,0.18) 0%, rgba(22,5,3,0) 55%),
                radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 60%);
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.05;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        }

        .title-font { font-family: 'Cinzel', serif; letter-spacing: 0.01em; }

        .vine-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--gold);
            opacity: 0.85;
        }
        .vine-divider .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
        }

        .reveal { opacity: 0; animation: reveal-up 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
        .reveal-1 { animation-delay: 0.05s; }
        .reveal-2 { animation-delay: 0.25s; }
        @keyframes reveal-up {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .reveal { animation: none !important; opacity: 1 !important; transform: none !important; }
        }

        /* card de membro */
        .member-card {
            background: linear-gradient(160deg, rgba(61,15,10,0.55), rgba(22,5,3,0.75));
            border: 1px solid rgba(201,162,39,0.25);
            border-radius: 1rem;
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
        }
        .member-card:hover {
            transform: translateY(-4px);
            border-color: rgba(201,162,39,0.6);
            box-shadow: 0 16px 40px -18px rgba(0,0,0,0.8);
        }

        .skin-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 0.75rem;
            overflow: hidden;
            background: linear-gradient(160deg, var(--wine), var(--wine-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(201,162,39,0.3);
        }
        .skin-frame img { width: 100%; height: 100%; object-fit: cover; }

        .online-dot {
            width: 0.6rem; height: 0.6rem;
            border-radius: 9999px;
            background: #4ade80;
            box-shadow: 0 0 0 3px rgba(74,222,128,0.2);
            flex-shrink: 0;
        }
        .offline-dot {
            width: 0.6rem; height: 0.6rem;
            border-radius: 9999px;
            background: rgba(241,230,210,0.25);
            flex-shrink: 0;
        }

        .rank-badge {
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            padding: 0.15rem 0.6rem;
            border-radius: 9999px;
            font-weight: 500;
        }
        .rank-leader { background: rgba(201,162,39,0.2); color: var(--gold-bright); border: 1px solid rgba(201,162,39,0.5); }
        .rank-coleader { background: rgba(154,51,39,0.25); color: #f1cfc7; border: 1px solid rgba(154,51,39,0.5); }
        .rank-member { background: rgba(241,230,210,0.08); color: rgba(241,230,210,0.7); border: 1px solid rgba(241,230,210,0.15); }

        .skeleton {
            background: linear-gradient(90deg, rgba(241,230,210,0.06) 25%, rgba(241,230,210,0.12) 37%, rgba(241,230,210,0.06) 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
            border-radius: 0.75rem;
        }
        @keyframes skeleton-loading {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        html { scroll-behavior: smooth; }
        ::selection { background: var(--gold); color: var(--cellar); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 backdrop-blur bg-cellar/80 border-b border-wine-light/30">
        <div class="container mx-auto px-4 py-4 flex flex-wrap md:flex-nowrap justify-center md:justify-between items-center gap-4 text-center md:text-left">
            <a href="index.html" class="flex items-center space-x-3">
                <i class="fas fa-wine-glass-alt text-2xl text-gold"></i>
                <h1 class="title-font text-2xl font-semibold text-cream">Clã <span class="text-gold">Vinícola</span></h1>
            </a>
            <nav class="w-full md:w-auto">
                <ul class="flex justify-center md:justify-end space-x-8 text-sm tracking-wide text-cream/80 font-body">
                    <li><a href="index.html#vinicola" class="hover:text-gold transition-colors">Vinícola</a></li>
                    <li><a href="membros.html" class="text-gold">Membros</a></li>
                    <li><a href="index.html#skip" class="hover:text-gold transition-colors">Ações</a></li>
                    <li><a href="index.html#contato" class="hover:text-gold transition-colors">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="flex-grow relative z-10">
        <section class="container mx-auto px-4 pt-14 pb-6 text-center">
            <h2 class="reveal reveal-1 title-font text-3xl md:text-4xl font-semibold text-cream mb-3">
                Membros do <span class="text-gold">Clã</span>
            </h2>
            <p id="clanSummary" class="reveal reveal-2 text-cream/70 max-w-xl mx-auto text-sm md:text-base">
                Carregando informações do clã…
            </p>
            <div class="vine-divider mt-8 max-w-md mx-auto">
                <span class="line"></span>
                <i class="fas fa-wine-bottle text-sm"></i>
                <span class="line"></span>
            </div>
        </section>

        <section class="container mx-auto px-4 pb-20">
            <div id="loadingGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
                <!-- skeletons injetados via JS -->
            </div>
            <div id="membersGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5 hidden"></div>
            <div id="errorState" class="hidden text-center text-cream/70 py-16">
                <i class="fas fa-triangle-exclamation text-gold text-3xl mb-4"></i>
                <p>Não foi possível carregar os membros do clã agora. Tenta de novo em instantes.</p>
            </div>
        </section>
    </main>

    <footer class="relative z-10 border-t border-wine-light/30 bg-wine-dark/30 py-8">
        <div class="container mx-auto px-4 text-center text-xs text-cream/50">
            <p>&copy; 2026 Clã Vinícola. Todos os direitos reservados.</p>
            <p class="mt-1">Site não oficial do "Wolvesville".</p>
        </div>
    </footer>

    <script>
        const API_BASE = "https://vinicolawov.viniciusxp13.workers.dev";

        const RANK_LABEL = { leader: "Líder", coleader: "Colíder", member: "Membro" };
        const RANK_ICON = { leader: "fa-crown", coleader: "fa-shield-halved", member: "fa-user" };

        function renderSkeletons(count) {
            const grid = document.getElementById('loadingGrid');
            grid.innerHTML = Array.from({ length: count }).map(() => `
                <div class="member-card p-3">
                    <div class="skeleton aspect-square mb-3"></div>
                    <div class="skeleton h-4 w-3/4 mb-2"></div>
                    <div class="skeleton h-3 w-1/2"></div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        function memberCard(member) {
            const rankClass = `rank-${member.rank}`;
            const rankLabel = RANK_LABEL[member.rank] || 'Membro';
            const rankIcon = RANK_ICON[member.rank] || 'fa-user';
            const dotClass = member.online ? 'online-dot' : 'offline-dot';
            const statusLabel = member.online ? 'Online' : 'Offline';

            const skinContent = member.skinImageUrl
                ? `<img src="${escapeHtml(member.skinImageUrl)}" alt="Skin de ${escapeHtml(member.username)}" loading="lazy">`
                : `<i class="fas fa-user-astronaut text-4xl text-cream/30"></i>`;

            return `
                <div class="member-card p-3 flex flex-col">
                    <div class="skin-frame mb-3">${skinContent}</div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="${dotClass}" title="${statusLabel}"></span>
                        <h3 class="title-font text-sm font-semibold text-cream truncate" title="${escapeHtml(member.username)}">
                            ${escapeHtml(member.username)}
                        </h3>
                    </div>
                    <div class="flex items-center justify-between mt-1">
                        <span class="text-xs text-cream/60">Nível ${escapeHtml(String(member.level))}</span>
                        <span class="rank-badge ${rankClass}"><i class="fas ${rankIcon} mr-1"></i>${rankLabel}</span>
                    </div>
                    ${member.flair ? `<p class="text-xs text-gold/80 italic mt-2 truncate" title="${escapeHtml(member.flair)}">"${escapeHtml(member.flair)}"</p>` : ''}
                </div>
            `;
        }

        async function loadMembers() {
            renderSkeletons(10);
            try {
                const resp = await fetch(`${API_BASE}/clanMembers`);
                if (!resp.ok) throw new Error('Falha ao buscar membros');
                const data = await resp.json();

                document.getElementById('clanSummary').textContent =
                    `${data.clan?.name || 'Clã Vinícola'} • ${data.clan?.memberCount ?? data.members.length} membros`;

                const grid = document.getElementById('membersGrid');
                grid.innerHTML = data.members.map(memberCard).join('');

                document.getElementById('loadingGrid').classList.add('hidden');
                grid.classList.remove('hidden');
            } catch (err) {
                document.getElementById('loadingGrid').classList.add('hidden');
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('clanSummary').textContent = 'Clã Vinícola';
            }
        }

        loadMembers();
    </script>

</body>
</html>
